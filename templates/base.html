<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pocket Money Manager{% endblock %} · Kenya Teachers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --mpesa-green: #00a651;
            --mpesa-dark: #006633;
        }
        body { background: #f4f7f5; }
        .navbar { background: linear-gradient(90deg, var(--mpesa-dark), var(--mpesa-green)) !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .stat-card { border-left: 4px solid var(--mpesa-green); }
        .badge-unallocated { background: #dc3545; }
        .badge-allocated { background: var(--mpesa-green); }
        .table th { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .03em; }
        .phone { font-family: ui-monospace, monospace; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
            <i class="bi bi-wallet2"></i> Pocket Money
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('transactions') }}">Transactions</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('students') }}">Students</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('parents') }}">Parents</a></li>
            </ul>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
