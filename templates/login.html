<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Pocket Money Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #006633, #00a651); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-lg p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-success">Pocket Money</h3>
                    <p class="text-muted small">Kenya Teachers · Automatic M-Pesa Tracker</p>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required autofocus>
                    </div>
                    <button class="btn btn-success w-100 btn-lg">Login</button>
                </form>
                <p class="text-muted small text-center mt-3 mb-0">Default password: <code>teacher123</code><br>Change it with APP_PASSWORD env var</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
